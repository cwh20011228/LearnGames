<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单数独</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .sudoku-container {
            display: grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            gap: 2px;
            background-color: #333;
            padding: 2px;
        }
        .sudoku-cell {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
        }
        .sudoku-cell input {
            width: 100%;
            height: 100%;
            text-align: center;
            border: none;
            font-size: 18px;
        }
        .sudoku-cell input:focus {
            outline: none;
            background-color: #e6f7ff;
        }
        .sudoku-cell:nth-child(3n) {
            margin-right: 2px;
        }
        .sudoku-cell:nth-child(27n) {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>
    <div class="sudoku-container" id="sudoku">
        <!-- 81 cells will be generated by JavaScript -->
    </div>

    <script>
        const sudokuContainer = document.getElementById('sudoku');
        
        // Generate 81 cells
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'sudoku-cell';
            
            const input = document.createElement('input');
            input.type = 'text';
            input.maxLength = 1;
            input.pattern = '[1-9]';
            
            cell.appendChild(input);
            sudokuContainer.appendChild(cell);
        }

        // Add event listeners to inputs
        const inputs = document.querySelectorAll('.sudoku-cell input');
        inputs.forEach(input => {
            input.addEventListener('input', (e) => {
                if (!/^[1-9]$/.test(e.target.value)) {
                    e.target.value = '';
                }
            });
        });
    </script>
</body>
</html>
